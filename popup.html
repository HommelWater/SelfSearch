<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0px;}
    body {
      width: 380px;
      min-width: 380px;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #CADCAE;
      color: black;
    }
    h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      border-left: 3px solid #EDA35A;
      padding-left: 8px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input:not([type="checkbox"]):not([type="radio"]), button {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      border: 1px solid #222;
      background: #E1E9C9;
      font-size: 0.85rem;
      /* Firefox doesn't inherit fonts into form controls and renders them
         with OS styling; inherit + appearance:none keeps them identical. */
      font-family: inherit;
      color: inherit;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    input[type="checkbox"] {
      appearance: auto;
      -webkit-appearance: auto;
      -moz-appearance: auto;
      width: 14px;
      height: 14px;
      flex: none;
      margin: 0;
    }
    button {
      background: #EDA35A;
      cursor: pointer;
      font-weight: 500;
      min-height: 34px;
    }
    button::-moz-focus-inner { border: 0; padding: 0; }
    button:hover { background: #FEE8D9; }
    button.secondary { background: #E1E9C9; }
    .server-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 4px 0;
    }
    .server-row input { flex: 1; margin: 0; }
    .server-row button { width: auto; padding: 8px 14px; margin: 0; }
    .friend-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 4px 0;
    }
    .friend-row .f-npub {
      flex: 1;
      font-size: 0.7rem;
      word-break: break-all;
      color: #2c3e2f;
    }
    .friend-row .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; flex: none; }
    .friend-row .dot.on { background: #2e7d32; }
    .friend-row button { width: auto; padding: 4px 8px; margin: 0; font-size: 0.7rem; }
    .status {
      margin-top: 10px;
      padding: 6px 10px;
      font-size: 0.75rem;
      border-left: 3px solid transparent;
    }
    .success { background: #d1e7c5; border-left-color: #2e7d32; }
    .error { background: #ffe0e0; border-left-color: #c62828; }
    .info { background: #e3f2fd; border-left-color: #1565c0; }
    hr { margin: 12px 0; border: none; border-top: 1px solid #222; }
    a { color: #1a3c1d; }
  </style>
</head>
<body>
  <h2>🔍 SelfSearch</h2>

  <div id="onboarding" class="status info">
    <b>Getting started</b>
    <ol style="margin:6px 0 0 16px; padding:0;">
      <li>Index a page below</li>
      <li>Add a friend's npub in the P2P section</li>
      <li>Search from the address bar: <b>ss&nbsp;query</b></li>
    </ol>
  </div>

  <div class="section">
    <label>📸 INDEX THIS PAGE</label>
    <button id="indexBtn">📸 INDEX THIS PAGE</button>
    <label style="display:flex; align-items:center; gap:8px; margin:8px 0;">
      <input type="checkbox" id="autoIndexCheckbox">
      <span style="font-weight:normal; text-transform:none;">Auto-index pages I spend time on <small style="display:inline; margin:0;">(URL + title only)</small></span>
    </label>
    <label>KEYWORDS FOR THIS PAGE <span style="font-weight:normal; text-transform:none;">(optional, comma/space separated)</span></label>
    <input type="text" id="keywordsInput" placeholder="e.g. recipe, sourdough" autocomplete="off">
    <div id="indexStatus" class="status"></div>
  </div>

  <hr>

  <div class="section">
    <button id="openSearchBtn" class="secondary">🔎 OPEN SEARCH</button>
  </div>

  <hr>

  <div class="section">
    <label>🔗 P2P NETWORK</label>
    <div id="meshStatus" class="status"></div>
    <label>YOUR ID</label>
    <input id="npubDisplay" type="text" readonly placeholder="generating key...">
    <label>MAX HOPS</label>
    <input id="maxHopsInput" type="number" min="1" max="5" value="2">
    <label>ADD FRIEND (npub)</label>
    <div class="server-row">
      <input id="friendInput" type="text" placeholder="npub1..." autocomplete="off">
      <button id="addFriendBtn" class="secondary">+</button>
    </div>
    <div id="friendsList"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
